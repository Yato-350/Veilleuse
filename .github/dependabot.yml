version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ['*']
    ignore:
      # typescript-eslint 8.x only supports TypeScript < 6.1: a TypeScript 7 bump breaks `npm ci` (peer dependency).
      # Lift this once a typescript-eslint release accepts TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
