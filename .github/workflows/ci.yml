name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: veilleuse-web
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      # A short smoke subset of the bot scenarios (tools/scenarios/README.md, about 3 minutes): version 1.1 saves and
      # screens, the title variants, a battle, and one ending played in English to the help card. The whole suite
      # (about 95 minutes) stays a local run: node tools/run-scenarios.mjs --jobs 2.
      - name: Bot smoke scenarios
        timeout-minutes: 10
        run: node tools/run-scenarios.mjs v11-prologue v11-saves v11-title-credits v11-wake3 lot0-titles lot1-battle-regulars lot13-silence-en --jobs 2
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Upload scenario screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-shots
          path: scenario-shots
          retention-days: 7
